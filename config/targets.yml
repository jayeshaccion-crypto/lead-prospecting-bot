targets:
  - name: "Justdial"
    entry_url: "https://www.justdial.com/Delhi/IT-Services/nct-10278073"
    parser: "parse_justdial"
    pages: 3
    fetch_kwargs:
      timeout: 90000
      max_detail_pages: 0
      page_delay: 4.0
      target_delay: 3.0
      disable_resources: true
      wait_selector: "[class*='listing'], [class*='card'], .jf-listing-card"

  - name: "IndiaMART"
    entry_url: "https://dir.indiamart.com/new-delhi/software-development-services.html"
    parser: "parse_indiamart"
    pages: 3
    fetch_kwargs:
      timeout: 120000
      max_detail_pages: 0
      page_delay: 8.0
      target_delay: 8.0
      disable_resources: true
      wait_selector: ".card, [class*='product'], [class*='listing'], .lcard"

  - name: "TradeIndia"
