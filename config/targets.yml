targets:
  - name: "Justdial"
    entry_url: "https://www.justdial.com/Delhi/IT-Services/nct-10278073"
    parser: "parse_justdial"
    pages: 3
    fetch_kwargs:
      timeout: 90000
      max_detail_pages: 0         # Phones already in __NEXT_DATA__, no emails/websites in API
      page_delay: 4.0
      target_delay: 3.0

  - name: "IndiaMART"
    entry_url: "https://dir.indiamart.com/new-delhi/software-development-services.html"
    parser: "parse_indiamart"
    pages: 3
    fetch_kwargs:
      timeout: 120000
      max_detail_pages: 0         # Browser body retrieval fails; httpx enrichment runs post-scrape
      page_delay: 8.0
      target_delay: 8.0

  - name: "TradeIndia"
    entry_url: "https://www.tradeindia.com/manufacturers/it-consultancy.html"
    parser: "parse_tradeindia"
    pages: 1
    fetch_kwargs:
      timeout: 90000
      max_detail_pages: 0         # Contact info is JS API only — not available in HTML
      page_delay: 3.0
      target_delay: 3.0
