[project]
name = "lead-prospecting-bot"
version = "0.1.0"
description = "Automated lead prospecting pipeline - scrape, score, and manage business leads"
requires-python = ">=3.12"
dependencies = [
    "scrapling>=0.4",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "neo4j>=5.20",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
